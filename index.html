    <!-- JSON-LD: FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "How long does a typical automation project take?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Most workflows ship in 2–4 weeks. We start with a discovery call, scope the highest-ROI process first, and roll out incrementally so you see value before the project ends."
          }
        },
        {
          "@type": "Question",
          "name": "What does it cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Engagements start at a fixed-scope build for a single workflow and scale into ongoing automation partnerships. We quote per project after a free 30-minute assessment so the price matches the ROI."
          }
        },
        {
          "@type": "Question",
          "name": "Which tools do you work with?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "We're tool-agnostic. Common stacks include Make.com, n8n, Zapier, OpenAI, Claude, Airtable, HubSpot, Notion, Slack, and custom code when needed. We pick what fits your team — not what we want to sell."
          }
        },
        {
          "@type": "Question",
          "name": "Will this replace my team?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "No. We replace busywork, not people. Our clients use the time they get back to focus on strategy, customer relationships, and growth — the work humans actually enjoy."
          }
        },
        {
          "@type": "Question",
          "name": "What happens after the workflow goes live?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Every build comes with documentation, monitoring, and a 30-day support window. Many clients keep us on a monthly retainer for new workflows, optimizations, and changes as their business evolves."
          }
        }
      ]
    }
    </script>
  </head>

  <body>
    <script>
      // Reserve campaign banner height before React mounts to prevent layout shift.
      (function () {
        try {
          if (localStorage.getItem('campaign-concierge-dismissed') === '1') {
            document.documentElement.style.setProperty('--campaign-banner-h', '0px');
          } else {
            // Approximate: 40px on mobile, 44px on >=768px. Will be precisely
            // updated by the React component once it mounts.
            var h = window.matchMedia('(min-width: 768px)').matches ? 44 : 40;
            document.documentElement.style.setProperty('--campaign-banner-h', h + 'px');
          }
        } catch (e) {
          document.documentElement.style.setProperty('--campaign-banner-h', '40px');
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
